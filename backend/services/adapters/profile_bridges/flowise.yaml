framework: flowise
framework_version: "agent-governance-toolkit-core==5.0.0;httpx==0.28.1"
ingestion_mode: stream
type_field: type
timestamp_field: timestamp
events:
  request_started:
    kind: integration.request.started
    payload:
      operation_id: operation_id
      flow_id: flow_id
      operation: operation
      arguments: arguments
  request_completed:
    kind: integration.request.completed
    payload:
      operation_id: operation_id
      flow_id: flow_id
      operation: operation
      remote_session_id: remote_session_id
      result: result
      status_code: status_code
      duration_ms: duration_ms
      outcome: outcome
  request_unknown:
    kind: integration.request.unknown
    payload:
      operation_id: operation_id
      flow_id: flow_id
      operation: operation
      status_code: status_code
      duration_ms: duration_ms
      outcome: outcome
