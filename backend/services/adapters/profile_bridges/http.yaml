framework: http
framework_version: "agent-governance-toolkit-core 5.0.0; FastAPI 0.136.3; Flask 3.1.3; Django 6.1.3"
ingestion_mode: stream
type_field: type
timestamp_field: timestamp
events:
  request_started:
    kind: task.started
    payload: {app_operation_id: operation_id, native_request_id: request_id, actor_did: actor_did, method: method, path: path, body_sha256: body_sha256}
  request_completed:
    kind: task.completed
    payload: {app_operation_id: operation_id, native_request_id: request_id, actor_did: actor_did, status: status, response_bytes: response_bytes}
  request_incomplete:
    kind: session.warning
    payload: {app_operation_id: operation_id, native_request_id: request_id, actor_did: actor_did, remote_outcome: remote_outcome}
