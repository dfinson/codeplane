framework: haystack
framework_version: "haystack-ai==3.0.0;openai==2.38.0;agent-governance-toolkit-core==5.0.0"
ingestion_mode: stream
type_field: type
timestamp_field: timestamp
events:
  component_started:
    kind: tool.call.started
    payload:
      operation_id: operation_id
      tool_call_id: operation_id
      tool_call_id_source: tool_call_id_source
      tool_name: component_id
      component_id: component_id
      component_did: component_did
      method: method
      arguments: arguments
  component_completed:
    kind: tool.call.completed
    payload:
      operation_id: operation_id
      tool_call_id: operation_id
      tool_call_id_source: tool_call_id_source
      tool_name: component_id
      component_id: component_id
      component_did: component_did
      method: method
      success: success
      reported_usage: reported_usage
      usage_correlation: usage_correlation
  component_failed:
    kind: tool.call.failed
    payload:
      operation_id: operation_id
      tool_call_id: operation_id
      tool_call_id_source: tool_call_id_source
      tool_name: component_id
      component_id: component_id
      component_did: component_did
      method: method
      error_type: error_type
      success: success
