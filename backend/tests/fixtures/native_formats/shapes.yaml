# Independently authored from the released producer contracts, not decoder output.
# All rows in this file are documented-shape fixtures, not live recordings.
aider:
  version: ">=0.70"
  transport: file_watch
  partial_records: 1
  evidence_limit: Analytics has LLM accounting, not tool execution or transcript text.
  records:
    - {event: message_send_starting, time: 1767323045}
    - {event: message_send, time: 1767323046, properties: {main_model: model-a, prompt_tokens: 0, completion_tokens: 3, total_tokens: 3, cost: 0}}
  expected:
    - [[llm.call.started, {}]]
    - [[llm.call.completed, {model: model-a, input_tokens: 0, output_tokens: 3, total_tokens: 3, cost: 0}]]
aider_markdown:
  version: ">=0.70"
  transport: file_watch
  partial_records: 1
  evidence_limit: Markdown commit output has no native call ID or start event. Token quantities remain strings.
  records:
    - {type: assistant_message, content: Inspect the file.}
    - {type: git_commit, commit_sha: abc123, commit_message: Fix route}
    - {type: token_usage, tokens_sent: "1.2k", tokens_received: "0"}
  expected:
    - [[message.assistant, {content: Inspect the file.}]]
    - [[tool.call.completed, {tool_name: git, result: abc123, message: Fix route}]]
    - [[telemetry.usage, {tokens_sent: "1.2k", tokens_received: "0"}]]
amazonq:
  version: "1.x"
  transport: poll
  partial_records: 1
  evidence_limit: Conversation rows have no usage. Results correlate by tool_use_id, not SQLite key.
  records:
    - key: /repo
      value:
        conversation_id: q1
        history:
          - user: {content: {Prompt: {prompt: Read the file.}}}
            assistant: {ToolUse: {content: Reading., tool_uses: [{id: call-1, name: read_file, args: {path: a.py}}]}}
    - key: /repo
      value:
        conversation_id: q1
        history:
          - user: {content: {ToolUseResults: {tool_use_results: [{tool_use_id: call-1, status: Error, content: [{Text: missing}]}]}}}
            assistant: {Response: {content: Not found.}}
  expected:
    - [[message.user, {content: Read the file.}], [message.assistant, {content: Reading.}], [tool.call.started, {tool_call_id: call-1, tool_name: read_file, arguments: {path: a.py}}]]
    - [[tool.call.completed, {tool_call_id: call-1, is_error: true, result: missing}], [message.assistant, {content: Not found.}]]
antigravity:
  version: google-antigravity-sdk
  transport: file_watch
  partial_records: 2
  evidence_limit: History exposes calls but not builtin results or token accounting.
  records:
    - {id: step-1, type: THINKING, step_index: 41, source: MODEL, thinking: Inspect first.}
    - {id: step-2, type: TOOL_CALL, step_index: 42, tool_calls: [{id: call-1, name: read_file, args: {path: a.py}}, {id: call-2, name: search, args: {pattern: route}}]}
  expected:
    - [[llm.reasoning.chunk, {content: Inspect first., step_index: 41}]]
    - [[tool.call.started, {tool_name: read_file, args: {path: a.py}, tool_call_id: call-1, step_index: 42}], [tool.call.started, {tool_name: search, args: {pattern: route}, tool_call_id: call-2, step_index: 42}]]
claude:
  version: "0.x"
  transport: file_watch
  partial_records: 1
  evidence_limit: Per-message usage is not a monetary cost. Repeated message IDs do not merge physical occurrences.
  records:
    - type: assistant
      cwd: /repo
      message:
        id: msg-1
        model: model-a
        content: [{type: text, text: Reading.}, {type: tool_use, id: call-1, name: read_file, input: {path: a.py}}]
        usage: {input_tokens: 0, output_tokens: 3, cache_read_input_tokens: 2}
    - {type: user, message: {content: [{type: tool_result, tool_use_id: call-1, is_error: true, content: [{type: text, text: missing}]}]}}
  expected:
    - [[message.assistant, {content: Reading.}], [tool.call.started, {tool_call_id: call-1, tool_name: read_file, arguments: {path: a.py}}], [telemetry.usage, {model: model-a, input_tokens: 0, output_tokens: 3, cache_read_tokens: 2, msg_id: msg-1}]]
    - [[tool.call.completed, {tool_call_id: call-1, success: false, result: missing}]]
cline:
  version: ">=3.88"
  transport: file_watch
  partial_records: 1
  evidence_limit: UI tool records have no call ID. API request data has no model field.
  records:
    - {type: say, say: reasoning, ts: 1767323045000, text: Inspect first.}
    - {type: say, say: tool, ts: 1767323046000, text: '{"tool":"readFile","path":"a.py"}'}
    - {type: say, say: api_req_finished, ts: 1767323047000, text: '{"tokensIn":0,"tokensOut":3,"cacheReads":2,"cost":0}'}
  expected:
    - [[llm.reasoning.chunk, {content: Inspect first.}]]
    - [[tool.call.completed, {tool_name: readFile, result: '{"tool":"readFile","path":"a.py"}', path: a.py}]]
    - [[llm.call.completed, {input_tokens: 0, output_tokens: 3, cost_usd: 0, cache_read_tokens: 2}]]
codex:
  version: "1.x"
  transport: file_watch
  partial_records: 1
  evidence_limit: Tool output alone is not a success or cost claim. Rollout timestamp is not mapped by this release.
  records:
    - {type: response_item, timestamp: "2026-01-02T03:04:05Z", payload: {type: function_call, call_id: call-1, name: shell, arguments: '{"command":"pwd"}'}}
    - {type: response_item, timestamp: "2026-01-02T03:04:06Z", payload: {type: function_call_output, call_id: call-1, output: /repo}}
  expected:
    - [[tool.call.started, {tool_call_id: call-1, tool_name: shell, arguments: {command: pwd}}]]
    - [[tool.call.completed, {tool_call_id: call-1, result: /repo}]]
continue_dev:
  version: "1.x"
  transport: file_watch
  partial_records: 1
  evidence_limit: Session snapshots carry camelCase tool identities and no usage accounting.
  records:
    - sessionId: session-1
      history:
        - message: {role: thinking, content: Inspect first.}
        - message: {role: assistant, content: Reading., toolCalls: [{id: call-1, function: {name: read_file, arguments: '{"path":"a.py"}'}}]}
    - sessionId: session-1
      history:
        - message: {role: tool, toolCallId: call-1, content: file text}
  expected:
    - [[llm.reasoning.chunk, {content: Inspect first.}], [message.assistant, {content: Reading.}], [tool.call.started, {tool_call_id: call-1, tool_name: read_file, arguments: {path: a.py}}]]
    - [[tool.call.completed, {tool_call_id: call-1, result: file text}]]
copilot:
  version: "1.x"
  transport: file_watch
  partial_records: 2
  evidence_limit: Usage counts are retained in native units, never inferred USD.
  records:
    - {id: vendor-1, type: assistant.message, data: {content: Reading.}}
    - {id: vendor-2, type: tool.execution_start, data: {toolCallId: call-1, toolName: read_file, arguments: {path: a.py}}}
    - {id: vendor-3, type: tool.execution_complete, data: {toolCallId: call-1, success: false, result: {content: missing}}}
    - {id: vendor-4, type: assistant.usage, data: {model: model-a, inputTokens: 0, outputTokens: 3, cacheReadTokens: 2}}
  expected:
    - [[message.assistant, {content: Reading.}]]
    - [[tool.call.started, {tool_call_id: call-1, tool_name: read_file, arguments: {path: a.py}}]]
    - [[tool.call.completed, {tool_call_id: call-1, success: false, result: missing}]]
    - [[telemetry.usage, {model: model-a, input_tokens: 0, output_tokens: 3, cache_read_tokens: 2}]]
copilot_markdown:
  version: ">=1.0"
  transport: sqlite
  partial_records: 2
  evidence_limit: Fenced-code tools are heuristic. No native call ID, execution result, or usage is recoverable.
  records:
    - {type: assistant_text, content: Inspect first.}
    - {type: tool_call, tool_name: shell, command: pwd}
    - {type: code_block, language: text, content: /repo}
  expected:
    - [[message.assistant, {content: Inspect first.}]]
    - [[tool.call.started, {tool_name: shell, input: pwd}]]
    - [[tool.output, {language: text, content: /repo}]]
copilot_vscode:
  version: vscode-chat-v3
  transport: file_watch
  partial_records: 2
  evidence_limit: Serialized invocation is completion evidence only. No fabricated start or usage.
  records:
    - {kind: 0, v: {sessionId: vscode-1, version: 3, requests: []}}
    - {kind: 2, k: [requests], v: [{requestId: request-1, modelId: model-a, message: {text: Read it.}}]}
    - {kind: 2, k: [requests, 0, response], v: [{kind: toolInvocationSerialized, toolCallId: call-1, toolId: read_file, isComplete: true, invocationMessage: {value: Reading.}}]}
    - {kind: 1, k: [requests, 0, elapsedMs], v: 0}
    - {kind: 2, k: [requests, 0, response], v: [{value: Done.}]}
  expected:
    - [[session.started, {session_id: vscode-1, version: 3}]]
    - [[message.user, {content: Read it., request_id: request-1, model: model-a}]]
    - [[tool.call.completed, {tool_call_id: call-1, tool_name: read_file, invocation: Reading., success: true, request_id: request-1, model: model-a}]]
    - [[llm.call.completed, {request_id: request-1, model: model-a, duration_ms: 0}]]
    - [[message.assistant, {content: Done., request_id: request-1, model: model-a}]]
crewai:
  version: ">=1.0.0"
  transport: file_watch
  partial_records: 1
  evidence_limit: Started event_id is not present on tool finish in this mapping. Missing IDs cannot be guessed.
  records:
    - {type: tool_usage_started, event_id: call-1, tool_name: read_file, tool_args: {path: a.py}}
    - {type: tool_usage_finished, tool_name: read_file, output: file text}
    - {type: llm_call_completed, model: model-a, response: Done., usage: {prompt_tokens: 0, completion_tokens: 3}}
  expected:
    - [[tool.call.started, {tool_name: read_file, tool_call_id: call-1, arguments: {path: a.py}}]]
    - [[tool.call.completed, {tool_name: read_file, result: file text}]]
    - [[llm.call.completed, {model: model-a, output: Done., input_tokens: 0, output_tokens: 3}]]
goose:
  version: ">=1.0"
  transport: poll
  partial_records: 1
  evidence_limit: SQLite message tokens are not usage-ledger accounting and must not be copied as cost.
  records:
    - {role: assistant, tokens: 999, content_json: '[{"type":"text","text":"Reading."},{"type":"toolRequest","id":"call-1","toolCall":{"status":"success","value":{"name":"read_file","arguments":{"path":"a.py"}}}}]'}
    - {role: user, content_json: '[{"type":"toolResponse","id":"call-1","toolResult":{"status":"error","value":{"content":"missing"}}}]'}
    - {role: usage, input_tokens: 0, output_tokens: 3, cache_read_tokens: 2, model: model-a}
  expected:
    - [[message.assistant, {content: Reading.}], [tool.call.started, {tool_name: read_file, tool_call_id: call-1, arguments: {path: a.py}}]]
    - [[tool.call.completed, {tool_call_id: call-1, result: missing, success: false}]]
    - [[telemetry.usage, {input_tokens: 0, output_tokens: 3, cache_read_tokens: 2, model: model-a}]]
langchain:
  version: ">=0.3"
  transport: file_watch
  partial_records: 1
  evidence_limit: Callback arguments are flat, unlike LangGraph. run_id is the tool correlation key.
  records:
    - {event: on_tool_start, run_id: call-1, name: read_file, inputs: {path: a.py}, input_str: a.py}
    - {event: on_tool_error, run_id: call-1, name: read_file, error: missing}
    - {event: on_llm_end, run_id: llm-1, response: {generations: [[{text: Done.}]], llm_output: {model_name: model-a, token_usage: {prompt_tokens: 0, completion_tokens: 3, total_tokens: 3}}}}
  expected:
    - [[tool.call.started, {tool_name: read_file, tool_call_id: call-1, arguments: {path: a.py}, input: a.py}]]
    - [[tool.call.failed, {tool_name: read_file, tool_call_id: call-1, error: missing}]]
    - [[llm.call.completed, {run_id: llm-1, model: model-a, output: Done., input_tokens: 0, output_tokens: 3, total_tokens: 3}]]
langgraph:
  version: ">=1.0"
  transport: file_watch
  partial_records: 1
  evidence_limit: astream_events v2 nests inputs under data. No callback-only error events are synthesized.
  records:
    - {event: on_tool_start, run_id: call-1, name: read_file, data: {input: {path: a.py}}}
    - {event: on_tool_end, run_id: call-1, name: read_file, data: {output: file text}}
    - {event: on_chat_model_end, run_id: llm-1, metadata: {ls_model_name: model-a}, data: {output: {content: Done., usage_metadata: {input_tokens: 0, output_tokens: 3, total_tokens: 3}}}}
  expected:
    - [[tool.call.started, {tool_name: read_file, tool_call_id: call-1, arguments: {path: a.py}}]]
    - [[tool.call.completed, {tool_call_id: call-1, tool_name: read_file, result: file text}]]
    - [[llm.call.completed, {model: model-a, run_id: llm-1, output: Done., input_tokens: 0, output_tokens: 3, total_tokens: 3}]]
maf:
  version: "1.3.0"
  transport: stream
  partial_records: 1
  evidence_limit: MAF telemetry attributes are not generic GenAI token or tool evidence.
  records:
    - {name: agents.app.route_handler, start_time_unix_nano: 0, attributes: {route.is_invoke: false, route.is_agentic: false}}
    - {name: agents.storage.read, start_time_unix_nano: 1000000, end_time_unix_nano: 3000000, attributes: {storage.keys.count: 0}}
  expected:
    - [[hook.started, {is_invoke: false, is_agentic: false}]]
    - [[memory.query.started, {key_count: 0, duration_ms: 2.0}]]
maf_transcript:
  version: ">=1.0.0"
  transport: file_watch
  partial_records: 1
  evidence_limit: Activity IDs are not tool call IDs. from_property is the native on-disk sender key.
  records:
    - {id: activity-1, type: invoke, from_property: {role: bot}, value: {command: read}}
    - {id: activity-2, type: event, from_property: {role: user}, text: Result., value: {ok: false}}
    - {id: activity-3, type: message, from_property: {role: bot, name: Agent}, text: Done.}
  expected:
    - [[tool.call.started, {input: {command: read}, activity_id: activity-1}]]
    - [[hook.started, {content: Result., value: {ok: false}, activity_id: activity-2}]]
    - [[message.assistant, {content: Done., activity_id: activity-3, from_name: Agent}]]
openai_agents:
  version: ">=0.3.3"
  transport: file_watch
  partial_records: 1
  evidence_limit: Response ID alone is not token accounting. Function span halves share span ID.
  records:
    - {object: trace, id: trace-1, workflow_name: Inspect}
    - {object: trace.span, id: call-1, trace_id: trace-1, started_at: "2026-01-02T03:04:05Z", ended_at: "2026-01-02T03:04:06Z", span_data: {type: function, name: read_file, input: {path: a.py}, output: file text}}
    - {object: trace.span, id: llm-1, trace_id: trace-1, ended_at: "2026-01-02T03:04:07Z", span_data: {type: generation, model: model-a, usage: {input_tokens: 0, output_tokens: 3}}}
  expected:
    - [[session.started, {trace_id: trace-1, workflow_name: Inspect}]]
    - [[tool.call.started, {tool_name: read_file, tool_call_id: call-1, arguments: {path: a.py}, span_id: call-1, trace_id: trace-1}], [tool.call.completed, {tool_name: read_file, tool_call_id: call-1, result: file text, span_id: call-1, trace_id: trace-1}]]
    - [[llm.call.completed, {model: model-a, input_tokens: 0, output_tokens: 3, usage: {input_tokens: 0, output_tokens: 3}, span_id: llm-1, trace_id: trace-1}]]
opencode:
  version: ">=1.17,<2.0"
  transport: sqlite
  partial_records: 1
  evidence_limit: Persisted seq, physical position and canonical event cursor are distinct. Pending tool state is provisional.
  records:
    - {seq: 41, type: message.part.updated.1, data: {sessionID: s1, part: {id: p1, messageID: m1, type: tool, callID: call-1, tool: read_file, state: {status: running, input: {path: a.py}}}}}
    - {seq: 42, type: message.part.updated.1, data: {sessionID: s1, part: {id: p1, messageID: m1, type: tool, callID: call-1, tool: read_file, state: {status: error, input: {path: a.py}, error: missing}}}}
    - {seq: 43, type: session.updated.1, data: {sessionID: s1, info: {cost: 0, tokens: {input: 0, output: 3, cache: {read: 2, write: 0}}}}}
  expected:
    - [[tool.call.started, {session_id: s1, message_id: m1, part_id: p1, call_id: call-1, tool: read_file, input: {path: a.py}}]]
    - [[tool.call.failed, {session_id: s1, message_id: m1, part_id: p1, call_id: call-1, tool: read_file, input: {path: a.py}, error: missing}]]
    - [[session.info, {session_id: s1, cost: 0, input_tokens: 0, output_tokens: 3, cache_read_tokens: 2, cache_write_tokens: 0}]]
openhands:
  version: ">=0.30,<2.0"
  transport: file_watch
  partial_records: 1
  evidence_limit: SDK action and observation retain call ID. This surface has no invented LLM usage.
  records:
    - {kind: ActionEvent, tool_name: terminal, tool_call_id: call-1, source: agent, action: {command: pwd}, summary: Inspect}
    - {kind: ObservationEvent, tool_name: terminal, tool_call_id: call-1, source: environment, observation: {command: pwd, exit_code: 0, content: [{text: /repo}]}}
  expected:
    - [[command.started, {command: pwd, summary: Inspect, tool_call_id: call-1, source: agent}]]
    - [[command.completed, {command: pwd, content: /repo, exit_code: 0, tool_call_id: call-1, source: environment}]]
pydantic_ai:
  version: ">=1.0.0"
  transport: file_watch
  partial_records: 1
  evidence_limit: No computed total_tokens is present in native model_dump. Denied tool results are failures.
  records:
    - {event_kind: function_tool_call, part: {part_kind: tool-call, tool_name: read_file, tool_call_id: call-1, args: {path: a.py}}}
    - {event_kind: function_tool_result, part: {part_kind: tool-return, tool_name: read_file, tool_call_id: call-1, content: blocked, outcome: denied}}
    - {kind: response, model_name: model-a, parts: [{part_kind: text, content: Done.}], usage: {input_tokens: 0, output_tokens: 3, cache_read_tokens: 2}}
  expected:
    - [[tool.call.started, {tool_name: read_file, tool_call_id: call-1, arguments: {path: a.py}}]]
    - [[tool.call.failed, {tool_call_id: call-1, tool_name: read_file, error: blocked, outcome: denied}]]
    - [[llm.call.completed, {model: model-a, input_tokens: 0, output_tokens: 3, cache_read_tokens: 2, content: Done.}]]
semantic_kernel:
  version: ">=1.0"
  transport: file_watch
  partial_records: 1
  evidence_limit: Filter invocation_id pairs callbacks. Plugin name is not a granted execution capability.
  records:
    - {type: native_function.started, invocation_id: call-1, function_name: read_file, plugin_name: files, arguments: {path: a.py}}
    - {type: native_function.failed, invocation_id: call-1, function_name: read_file, plugin_name: files, error: missing}
    - {type: prompt_function.completed, invocation_id: llm-1, function_name: summarize, model: model-a, result: Done., usage: {prompt_tokens: 0, completion_tokens: 3}}
  expected:
    - [[tool.call.started, {tool_name: read_file, plugin_name: files, tool_call_id: call-1, arguments: {path: a.py}}]]
    - [[tool.call.failed, {tool_name: read_file, plugin_name: files, tool_call_id: call-1, error: missing}]]
    - [[llm.call.completed, {function_name: summarize, tool_call_id: llm-1, model: model-a, output: Done., input_tokens: 0, output_tokens: 3}]]
smolagents:
  version: ">=1.0"
  transport: file_watch
  partial_records: 1
  evidence_limit: ActionStep observations are not individual tool completions. No total or cost is synthesized.
  # FinalAnswerStep is inferred only when output is the sole data field.
  extension_changed_records:
    1: [[raw, {original_type: unknown}]]
  records:
    - {step_number: 1, model_output: Reading., tool_calls: [{id: call-1, type: function, function: {name: read_file, arguments: {path: a.py}}}], token_usage: {input_tokens: 0, output_tokens: 3}}
    - {output: Done.}
  expected:
    - [[message.assistant, {content: Reading., step_number: 1, input_tokens: 0, output_tokens: 3}], [tool.call.started, {tool_name: read_file, tool_call_id: call-1, arguments: {path: a.py}}]]
    - [[session.ended, {output: Done.}]]
sweagent:
  version: ">=1.0"
  transport: file_watch
  partial_records: 1
  evidence_limit: History carries tool_calls as message data, not start events. Top-level model_stats are unavailable here.
  records:
    - {role: assistant, agent: main, message_type: action, content: Reading., tool_calls: [{id: call-1, function: {name: read_file, arguments: '{"path":"a.py"}'}}]}
    - {role: tool, agent: main, message_type: observation, content: missing, tool_call_ids: [call-1]}
  expected:
    - [[message.assistant, {content: Reading., tool_calls: [{id: call-1, function: {name: read_file, arguments: '{"path":"a.py"}'}}], agent: main, message_type: action}]]
    - [[tool.output, {content: missing, tool_call_ids: [call-1], agent: main, message_type: observation}]]
