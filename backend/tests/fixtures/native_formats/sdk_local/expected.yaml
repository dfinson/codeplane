# Independently specified from inert inputs and the released mapping contract.
# Native/capture IDs are copied from raw capture, not generated by the decoder.
langchain:
  version: ">=0.3"
  transport: file_watch
  partial_records: 1
  paired_kinds: [tool.call.completed, tool.call.failed, tool.call.completed]
  completed_record_indices: [1, 3, 5]
  expected:
    - - [tool.call.started, {tool_name: local, tool_call_id: "01a1ee8b-d040-7773-b097-f115355777fd", arguments: {value: alpha}, input: "{'value': 'alpha'}"}]
    - - [tool.call.completed, {tool_name: local, tool_call_id: "01a1ee8b-d040-7773-b097-f115355777fd", result: {echo: alpha, count: 0, ok: false}}]
    - - [tool.call.started, {tool_name: local, tool_call_id: "01a1ee8b-d041-76e0-bcb2-04ea0d4a6906", arguments: {value: fail}, input: "{'value': 'fail'}"}]
    - - [tool.call.failed, {tool_name: local, tool_call_id: "01a1ee8b-d041-76e0-bcb2-04ea0d4a6906", error: local rejection}]
    - - [tool.call.started, {tool_name: local, tool_call_id: "01a1ee8b-d041-76e0-bcb2-04eb37a807b3", arguments: {value: async}, input: "{'value': 'async'}"}]
    - - [tool.call.completed, {tool_name: local, tool_call_id: "01a1ee8b-d041-76e0-bcb2-04eb37a807b3", result: {echo: async, count: 0, ok: false}}]
semantic_kernel:
  version: ">=1.0"
  transport: file_watch
  partial_records: 1
  # Auto invocation wraps the native invocation; two filter pairs are not two tool executions.
  paired_kinds: [tool.call.completed, tool.call.failed, tool.call.completed, tool.call.completed]
  completed_record_indices: [1, 3, 6, 7]
  expected:
    - - [tool.call.started, {tool_name: local, plugin_name: test, tool_call_id: "d448ad43-e9d6-4f65-98fd-c1fd4e47e061", arguments: {value: alpha}}]
    - - [tool.call.completed, {tool_name: local, plugin_name: test, tool_call_id: "d448ad43-e9d6-4f65-98fd-c1fd4e47e061", result: "result:alpha"}]
    - - [tool.call.started, {tool_name: local, plugin_name: test, tool_call_id: "4ce827ef-44bf-4f5f-b0fd-03083e2e8726", arguments: {value: fail}}]
    - - [tool.call.failed, {tool_name: local, plugin_name: test, tool_call_id: "4ce827ef-44bf-4f5f-b0fd-03083e2e8726", error: local rejection}]
    - - [tool.call.started, {tool_name: local, plugin_name: test, tool_call_id: "1d71d48a-bb32-49c2-96c0-075d4649bbe4", arguments: {value: auto}, function_count: 1, request_sequence_index: 0, function_sequence_index: 0}]
    - - [tool.call.started, {tool_name: local, plugin_name: test, tool_call_id: "5e65064b-8996-43ae-867f-4898766301e0", arguments: {value: auto}}]
    - - [tool.call.completed, {tool_name: local, plugin_name: test, tool_call_id: "5e65064b-8996-43ae-867f-4898766301e0", result: "result:auto"}]
    - - [tool.call.completed, {tool_name: local, plugin_name: test, tool_call_id: "1d71d48a-bb32-49c2-96c0-075d4649bbe4", result: "result:auto", terminate: false}]
maf_transcript:
