name: CI

on:
  workflow_dispatch:
    inputs:
      windows_recipe_qualification:
        description: Run native Windows containment, audit, VAPID, and source ownership/watch cases
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.windows_recipe_qualification && '-windows-recipe' || '' }}
  cancel-in-progress: ${{ !inputs.windows_recipe_qualification }}

jobs:
  backend:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_recipe_qualification
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@codeplane.dev"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra legacy-traceforge

      - name: Lint
        run: uv run ruff check backend/

      - name: Format check
        run: uv run ruff format --check backend/

      - name: Type check
        run: uv run mypy backend/

      - name: Test
        run: uv run pytest --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=63

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_recipe_qualification
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/coverage-final.json
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@codeplane.dev"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd frontend && npx playwright test
        env:
          CI: true
          CODEPLANE_E2E_FAKE_AGENT: "1"

      - name: Run tracker synchronization E2E test
        run: cd frontend && npm run lint:e2e:tracker && npm run test:e2e:tracker

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  windows-recipe-qualification:
    name: Native Windows recipe containment
    if: github.event_name == 'workflow_dispatch' && inputs.windows_recipe_qualification
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_CONCURRENT_DOWNLOADS: "2"
      UV_CONCURRENT_BUILDS: "1"
      HATCH_BUILD_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Record exact source revision
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Native Windows recipe qualification: $revision"
          Add-Content -Path $env:GITHUB_ENV -Value "CODEPLANE_HOME=$env:RUNNER_TEMP/codeplane-recipe-qualification"
          uv --version
      - name: Run real owned-process tests serially
        shell: pwsh
        run: |
          uv sync --no-default-groups
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -q backend/tests/unit/test_recipe_windows_process.py -k native_windows_child --junitxml=recipe-windows-results.xml --tb=short
      - name: Require both native cases without skips
        run: >-
          uv run --no-project python -c
          "from xml.etree import ElementTree as E; cases=E.parse('recipe-windows-results.xml').findall('.//testcase'); assert len(cases)==2, len(cases); assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases); print('Both native active/exited leader cases passed without skips.')"
      - name: Qualify protected native Windows audit storage
        shell: pwsh
        run: |
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -q backend/tests/unit/test_windows_audit.py --junitxml=audit-windows-results.xml --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project python -c "from xml.etree import ElementTree as E; cases=E.parse('audit-windows-results.xml').findall('.//testcase'); assert len(cases)==2, len(cases); assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)"
      - name: Qualify native Windows VAPID key publication
        shell: pwsh
        run: |
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -v backend/tests/unit/test_vapid_keys.py --timeout=60 --junitxml=vapid-windows-results.xml --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project python -c "from xml.etree import ElementTree as E; cases=E.parse('vapid-windows-results.xml').findall('.//testcase'); assert len(cases)==21, len(cases); assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases); print('All 21 VAPID key/publication cases passed without skips.')"
      - name: Qualify native Windows source ownership and fresh observation
        shell: pwsh
        run: |
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -c "import importlib.util, sys; assert sys.platform == 'win32', sys.platform; assert all(importlib.util.find_spec(name) is None for name in ('traceforge', 'numpy', 'torch', 'onnxruntime')), 'Native source qualification requires default-only dependencies'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = @(
            "backend/tests/unit/test_native_source_ownership.py",
            "backend/tests/unit/test_native_jsonl_watch.py::test_fresh_tail_keeps_physical_decoded_emitted_and_storage_counts",
            "backend/tests/unit/test_native_jsonl_watch.py::test_incomplete_suffix_waits_for_newline_without_advancing",
            "backend/tests/unit/test_native_jsonl_watch.py::test_restart_rejects_rewritten_bytes_even_if_json_semantics_match",
            "backend/tests/unit/test_native_jsonl_watch.py::test_resume_rejects_late_accepted_rewrite_and_discards_reconstruction"
          )
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -v @targets --timeout=60 --junitxml=native-source-windows-results.xml --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require all exact native source cases without skips or errors
        shell: pwsh
        run: |
          @'
          from xml.etree import ElementTree as E
          root = E.parse("native-source-windows-results.xml")
          cases = root.findall(".//testcase")
          ownership = "backend.tests.unit.test_native_source_ownership"
          watcher = "backend.tests.unit.test_native_jsonl_watch"
          expected = {
              (ownership, "test_child_owner_blocks_until_release[graceful]"),
              (ownership, "test_child_owner_blocks_until_release[terminated]"),
              (ownership, "test_parent_owner_keeps_other_jobs_and_databases_independent"),
              (watcher, "test_incomplete_suffix_waits_for_newline_without_advancing"),
              (watcher, "test_restart_rejects_rewritten_bytes_even_if_json_semantics_match"),
          }
          for framework in ("copilot", "claude"):
              expected.add((ownership, f"test_fresh_v2_watcher_owns_source_across_processes[{framework}]"))
              expected.add((watcher, f"test_fresh_tail_keeps_physical_decoded_emitted_and_storage_counts[{framework}]"))
              for boundary in ("first_replayed_event", "last_replayed_event"):
                  expected.add((watcher, f"test_resume_rejects_late_accepted_rewrite_and_discards_reconstruction[{boundary}-{framework}]"))
          actual = {(case.get("classname"), case.get("name")) for case in cases}
          assert len(cases) == len(expected) == 13, (len(cases), len(expected))
          assert actual == expected, {"missing": expected - actual, "unexpected": actual - expected}
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error"))
          assert all(int(suite.get(tag, "0")) == 0 for suite in root.findall(".//testsuite") for tag in ("skipped", "failures", "errors"))
          print("All 13 exact native source cases passed without skips, failures, or errors:")
          print("\n".join(f"{module}::{name}" for module, name in sorted(actual)))
          '@ | uv run --no-project python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-windows-native-${{ github.sha }}
          path: |
            recipe-windows-results.xml
            audit-windows-results.xml
            vapid-windows-results.xml
            native-source-windows-results.xml
          if-no-files-found: warn
          retention-days: 14
