name: CI

on:
  workflow_dispatch:
    inputs:
      windows_recipe_qualification:
        description: Run native Windows containment, audit, VAPID, source ownership/watch, and Story subprocess cases
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.windows_recipe_qualification && '-windows-recipe' || '' }}
  cancel-in-progress: ${{ !inputs.windows_recipe_qualification }}

jobs:
  backend:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_recipe_qualification
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@codeplane.dev"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check backend/

      - name: Format check
        run: uv run ruff format --check backend/

      - name: Type check
        run: uv run mypy backend/

      - name: Test
        run: uv run pytest --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=63

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_recipe_qualification
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/coverage-final.json
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@codeplane.dev"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd frontend && npx playwright test
        env:
          CI: true
          CODEPLANE_E2E_FAKE_AGENT: "1"

      - name: Run tracker synchronization E2E test
        run: cd frontend && npm run lint:e2e:tracker && npm run test:e2e:tracker

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  windows-recipe-qualification:
    name: Native Windows recipe containment
    if: github.event_name == 'workflow_dispatch' && inputs.windows_recipe_qualification
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_CONCURRENT_DOWNLOADS: "2"
      UV_CONCURRENT_BUILDS: "1"
      HATCH_BUILD_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Record exact source revision
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Native Windows recipe qualification: $revision"
          Add-Content -Path $env:GITHUB_ENV -Value "CODEPLANE_HOME=$env:RUNNER_TEMP/codeplane-recipe-qualification"
          uv --version
      - name: Install default-core dependencies
        shell: pwsh
        run: |
          uv sync --locked --no-default-groups
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture verified public wheels for the installed Windows core
        timeout-minutes: 8
        shell: pwsh
        run: |
          $corePython = uv run --no-sync python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from urllib.request import HTTPRedirectHandler, build_opener
          from packaging.tags import sys_tags
          from packaging.utils import canonicalize_name, parse_wheel_filename

          assert sys.platform == "win32", sys.platform
          root = Path.cwd()
          lock_bytes = (root / "uv.lock").read_bytes()
          lock = tomllib.loads(lock_bytes.decode())
          project = canonicalize_name(tomllib.loads((root / "pyproject.toml").read_text())["project"]["name"])
          tags = {tag: index for index, tag in enumerate(sys_tags())}
          output = Path(os.environ["RUNNER_TEMP"]) / "codeplane-core-wheelhouse"
          output.mkdir(exist_ok=False)

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("Public wheel capture does not follow redirects")

          client = build_opener(NoRedirect())
          core = json.loads(subprocess.check_output([sys.argv[1], "-c", """
          import importlib.metadata as metadata
          import json, sys
          print(json.dumps({
              "python": sys.version, "platform": sys.platform,
              "packages": [
                  {"name": dist.metadata["Name"], "version": dist.version,
                   "editable": json.loads(dist.read_text("direct_url.json") or "{}").get("dir_info", {}).get("editable", False)}
                  for dist in metadata.distributions()
              ],
          }))
          """], text=True))
          assert core["python"] == sys.version and core["platform"] == sys.platform
          manifest = {
              "format": "codeplane-installed-core-wheels-v1",
              "source_revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "lock_sha256": hashlib.sha256(lock_bytes).hexdigest(),
              "python": sys.version,
              "platform": sys.platform,
              "packages": [],
          }
          installed = {}
          for dist in core["packages"]:
              name = canonicalize_name(dist["name"])
              if name == project or dist["editable"]:
                  continue
              assert name not in installed or installed[name] == dist["version"], f"Conflicting installed versions: {name}"
              installed[name] = dist["version"]

          for name, version in sorted(installed.items()):
              candidates = []
              for package in lock["package"]:
                  if canonicalize_name(package["name"]) != name or package["version"] != version:
                      continue
                  for wheel in package.get("wheels", []):
                      url = urlsplit(wheel["url"])
                      assert url.scheme == "https" and url.netloc == "files.pythonhosted.org", wheel["url"]
                      assert not url.query and not url.fragment, wheel["url"]
                      filename = unquote(url.path.rsplit("/", 1)[-1])
                      assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.+-]*\.whl", filename), filename
                      wheel_name, wheel_version, _, wheel_tags = parse_wheel_filename(filename)
                      assert wheel_name == name and str(wheel_version) == version, filename
                      supported = [tags[tag] for tag in wheel_tags if tag in tags]
                      if supported:
                          candidates.append((min(supported), filename, wheel))
              assert candidates, f"No locked compatible public wheel for installed {name}=={version}"
              _, filename, wheel = min(candidates, key=lambda item: (item[0], item[1]))
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", wheel["hash"]), filename
              expected = wheel["hash"].split(":", 1)[1]
              size = wheel["size"]
              assert type(size) is int and size > 0, filename
              digest, received = hashlib.sha256(), 0
              target = output / filename
              with client.open(wheel["url"], timeout=30) as response, target.open("xb") as destination:
                  assert response.status == 200 and response.geturl() == wheel["url"], filename
                  while chunk := response.read(1024 * 1024):
                      received += len(chunk)
                      assert received <= size, f"Wheel exceeds locked size: {filename}"
                      digest.update(chunk)
                      destination.write(chunk)
              assert received == size and digest.hexdigest() == expected, f"Wheel integrity mismatch: {filename}"
              manifest["packages"].append({
                  "name": name, "version": version, "filename": filename, "url": wheel["url"],
                  "size": received, "sha256": digest.hexdigest(),
              })
          assert manifest["packages"], "No installed core packages were captured"
          (output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Verified {len(manifest['packages'])} exact installed core wheels against uv.lock")
          '@ | uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python - "$corePython"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified installed-core wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/codeplane-core-wheelhouse/
          if-no-files-found: error
          retention-days: 14
      - name: Run real owned-process tests serially
        shell: pwsh
        run: |
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -q backend/tests/unit/test_recipe_windows_process.py -k native_windows_child --junitxml=recipe-windows-results.xml --tb=short
      - name: Require both native cases without skips
        run: >-
          uv run --no-project python -c
          "from xml.etree import ElementTree as E; cases=E.parse('recipe-windows-results.xml').findall('.//testcase'); assert len(cases)==2, len(cases); assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases); print('Both native active/exited leader cases passed without skips.')"
      - name: Qualify protected native Windows audit storage
        shell: pwsh
        run: |
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -q backend/tests/unit/test_windows_audit.py --junitxml=audit-windows-results.xml --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project python -c "from xml.etree import ElementTree as E; cases=E.parse('audit-windows-results.xml').findall('.//testcase'); assert len(cases)==2, len(cases); assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)"
      - name: Qualify native Windows VAPID key publication
        shell: pwsh
        run: |
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -v backend/tests/unit/test_vapid_keys.py --timeout=60 --junitxml=vapid-windows-results.xml --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project python -c "from xml.etree import ElementTree as E; cases=E.parse('vapid-windows-results.xml').findall('.//testcase'); assert len(cases)==21, len(cases); assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases); print('All 21 VAPID key/publication cases passed without skips.')"
      - name: Qualify native Windows source ownership and fresh observation
        shell: pwsh
        run: |
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -c "import importlib.util, sys; assert sys.platform == 'win32', sys.platform; assert all(importlib.util.find_spec(name) is None for name in ('traceforge', 'numpy', 'torch', 'onnxruntime')), 'Native source qualification requires default-only dependencies'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = @(
            "backend/tests/unit/test_native_source_ownership.py",
            "backend/tests/unit/test_native_jsonl_watch.py::test_fresh_tail_keeps_physical_decoded_emitted_and_storage_counts",
            "backend/tests/unit/test_native_jsonl_watch.py::test_incomplete_suffix_waits_for_newline_without_advancing",
            "backend/tests/unit/test_native_jsonl_watch.py::test_restart_rejects_rewritten_bytes_even_if_json_semantics_match",
            "backend/tests/unit/test_native_jsonl_watch.py::test_resume_rejects_late_accepted_rewrite_and_discards_reconstruction",
            "backend/tests/unit/test_native_acquisition.py::test_snapshot_ctime_is_compared_within_the_same_metadata_api",
            "backend/tests/unit/test_native_format_conformance.py::test_actual_antigravity_history_acquisition_keeps_original_prefix_and_rewrites_fail",
            "backend/tests/unit/test_native_format_conformance.py::test_actual_cline_incremental_registered_history_preserves_ui_evidence_and_native_ids",
            "backend/tests/unit/test_native_format_conformance.py::test_actual_local_sdk_bytes_payload_identity_and_absent_usage",
            "backend/tests/unit/test_native_format_conformance.py::test_actual_local_sdk_partial_pairs_remain_explicit",
            "backend/tests/unit/test_native_format_conformance.py::test_actual_local_sdk_registered_history_retains_bytes_semantics_and_exact_retries"
          )
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -v @targets --timeout=60 --junitxml=native-source-windows-results.xml --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require all exact native source cases without skips or errors
        shell: pwsh
        run: |
          @'
          from xml.etree import ElementTree as E
          root = E.parse("native-source-windows-results.xml")
          cases = root.findall(".//testcase")
          ownership = "backend.tests.unit.test_native_source_ownership"
          watcher = "backend.tests.unit.test_native_jsonl_watch"
          acquisition = "backend.tests.unit.test_native_acquisition"
          conformance = "backend.tests.unit.test_native_format_conformance"
          expected = {
              (ownership, "test_child_owner_blocks_until_release[graceful]"),
              (ownership, "test_child_owner_blocks_until_release[terminated]"),
              (ownership, "test_parent_owner_keeps_other_jobs_and_databases_independent"),
              (watcher, "test_incomplete_suffix_waits_for_newline_without_advancing"),
              (watcher, "test_restart_rejects_rewritten_bytes_even_if_json_semantics_match"),
          }
          for framework in ("copilot", "claude"):
              expected.add((ownership, f"test_fresh_v2_watcher_owns_source_across_processes[{framework}]"))
              expected.add((watcher, f"test_fresh_tail_keeps_physical_decoded_emitted_and_storage_counts[{framework}]"))
              for boundary in ("first_replayed_event", "last_replayed_event"):
                  expected.add((watcher, f"test_resume_rejects_late_accepted_rewrite_and_discards_reconstruction[{boundary}-{framework}]"))
          for change in ("none", "descriptor-ctime", "path-identity"):
              expected.add((acquisition, f"test_snapshot_ctime_is_compared_within_the_same_metadata_api[{change}]"))
          expected.add((conformance, "test_actual_antigravity_history_acquisition_keeps_original_prefix_and_rewrites_fail"))
          for defect in ("rewrite", "version-drift"):
              expected.add((conformance, f"test_actual_cline_incremental_registered_history_preserves_ui_evidence_and_native_ids[{defect}]"))
          for name in ("langchain", "semantic_kernel", "maf_transcript"):
              for test in (
                  "test_actual_local_sdk_bytes_payload_identity_and_absent_usage",
                  "test_actual_local_sdk_partial_pairs_remain_explicit",
                  "test_actual_local_sdk_registered_history_retains_bytes_semantics_and_exact_retries",
              ):
                  expected.add((conformance, f"{test}[{name}]"))
          actual = {(case.get("classname"), case.get("name")) for case in cases}
          assert len(cases) == len(expected) == 28, (len(cases), len(expected))
          assert actual == expected, {"missing": expected - actual, "unexpected": actual - expected}
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error"))
          assert all(int(suite.get(tag, "0")) == 0 for suite in root.findall(".//testsuite") for tag in ("skipped", "failures", "errors"))
          print("All 28 exact native source cases passed without skips, failures, or errors:")
          print("\n".join(f"{module}::{name}" for module, name in sorted(actual)))
          '@ | uv run --no-project python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify native Windows Story tokenizer process cleanup
        shell: pwsh
        run: |
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -c "import importlib.util, sys; assert sys.platform == 'win32', sys.platform; assert importlib.util.find_spec('tiktoken') is None, 'Story qualification requires the default core without optional tokenizer packages'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync --with "pytest>=8,<9" --with "pytest-asyncio>=0.24,<1" --with "pytest-timeout>=2.4,<3" python -m pytest -v backend/tests/unit/test_story_tokenizer_import.py --timeout=60 --junitxml=story-tokenizer-windows-results.xml --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require all exact Story cases without skips or errors
        shell: pwsh
        run: |
          @'
          from xml.etree import ElementTree as E
          root = E.parse("story-tokenizer-windows-results.xml")
          cases = root.findall(".//testcase")
          module = "backend.tests.unit.test_story_tokenizer_import"
          expected = {(module, name) for name in (
              "test_populated_story_drain_does_not_stall_http_or_shutdown",
              "test_story_tokenizer_deadline_is_explicit_and_reaps_worker[False]",
              "test_story_tokenizer_deadline_is_explicit_and_reaps_worker[True]",
              "test_loader_error_remains_explicit_without_estimated_story",
              "test_overlapping_story_counts_keep_one_owned_worker_through_repeated_cancellation",
              "test_missing_optional_tokenizer_still_uses_logged_estimate_without_worker",
              "test_cold_cache_story_and_lifespan_imports_do_not_load_encoding",
          )}
          actual = {(case.get("classname"), case.get("name")) for case in cases}
          assert len(cases) == len(expected) == 7, (len(cases), len(expected))
          assert actual == expected, {"missing": expected - actual, "unexpected": actual - expected}
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error"))
          assert all(int(suite.get(tag, "0")) == 0 for suite in root.findall(".//testsuite") for tag in ("skipped", "failures", "errors"))
          print("All 7 exact Story subprocess cases passed without skips, failures, or errors:")
          print("\n".join(f"{module}::{name}" for module, name in sorted(actual)))
          '@ | uv run --no-project python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-windows-native-${{ github.sha }}
          path: |
            recipe-windows-results.xml
            audit-windows-results.xml
            vapid-windows-results.xml
            native-source-windows-results.xml
            story-tokenizer-windows-results.xml
          if-no-files-found: warn
          retention-days: 14
